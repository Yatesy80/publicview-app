<!DOCTYPE html>
<html>
<head>
  <title>PublicView AU</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; margin: 0; padding: 20px; background: #f0f0f0; }
    h1 { color: #0056b3; text-align: center; }
    input { width: 100%; padding: 12px; font-size: 18px; border: 1px solid #ccc; border-radius: 8px; }
    button { width: 100%; padding: 14px; background: #007bff; color: white; border: none; border-radius: 8px; font-size: 18px; margin-top: 10px; }
    .result { background: white; padding: 15px; margin: 10px 0; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  </style>
</head>
<body>

  <h1>PublicView AU</h1>
  <p style="text-align:center;">Search Australian public records</p>

  <input type="text" id="search" placeholder="Enter name, address, or ID...">
  <button onclick="search()">Search</button>

  <div id="results"></div>

  <script>
    function search() {
      const query = document.getElementById('search').value.toLowerCase();
      const results = [
        { name: "John Doe", id: "REC001", address: "123 Sydney St, NSW", type: "Property" },
        { name: "Jane Smith", id: "REC002", address: "456 Melbourne Rd, VIC", type: "Business" },
        { name: "Public Park", id: "REC003", address: "789 Brisbane Ave, QLD", type: "Land" }
      ];

      const matches = results.filter(r => 
        r.name.toLowerCase().includes(query) || 
        r.address.toLowerCase().includes(query) || 
        r.id.includes(query)
      );

      const div = document.getElementById('results');
      if (matches.length == 0) {
        div.innerHTML = "<p>No results found.</p>";
        return;
      }

      div.innerHTML = matches.map(r => `
        <div class="result">
          <b>${r.name}</b> (${r.id})<br>
          ${r.address}<br>
          <i>${r.type} Record</i>
        </div>
      `).join('');
    }
  </script>
